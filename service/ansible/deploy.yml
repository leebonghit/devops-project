---
- name: Deploy Docker service
  hosts: "{{ deploy_target }}"
  become: true

  vars:
    deploy_target: uat
    service_name: instahelper-service
    docker_image: skillbox/app
    docker_tag: latest
    service_port: 80
    container_port: 8080

  tasks:
    - name: Copy systemd unit file
      ansible.builtin.template:
        src: templates/docker-service.service.j2
        dest: "/etc/systemd/system/{{ service_name }}.service"
        mode: "0644"

    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Enable and restart service
      ansible.builtin.systemd:
        name: "{{ service_name }}"
        enabled: true
        state: restarted
