---
- name: Deploy Docker service
  hosts: app
  become: true

  vars:
    service_name: instahelper-service
    docker_image: nginx
    docker_tag: alpine
    service_port: 80
    container_port: 80

  tasks:
    - name: Copy systemd unit file
      ansible.builtin.template:
        src: templates/docker-service.service.j2
        dest: "/etc/systemd/system/{{ service_name }}.service"
        mode: "0644"

    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Enable and restart service
      ansible.builtin.systemd:
        name: "{{ service_name }}"
        enabled: true
        state: restarted
